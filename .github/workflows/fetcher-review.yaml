name: Fetcher terminal-close review gate
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  fetcher-review:
    runs-on: macos-15
    timeout-minutes: 20
    defaults:
      run:
        working-directory: mihomo
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          path: mihomo
      # Checkout paths must be inside GITHUB_WORKSPACE; nest core checkout so
      # this immutable dependency is exactly ../sing-shadowsocks2 to go.mod.
      - uses: actions/checkout@v4
        with:
          repository: llyufenggotest/sing-shadowsocks2-meta
          ref: 0e35d2749fdc58d18dd7d612482adbfbd362c8f3
          path: sing-shadowsocks2
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: mihomo/go.mod
          cache-dependency-path: mihomo/go.sum
      - name: Exact independent final-review RED then GREEN
        run: |
          python3 memory/review-fix/verify_final_fetcher.py red
          python3 memory/review-fix/verify_final_fetcher.py green
      - name: Immutable baseline must reproduce real RED
        run: python3 memory/review-fix/verify_fetcher.py baseline
      - name: Normal, low-memory and stress behavior
        run: python3 memory/review-fix/verify_fetcher.py green
      - name: Actual race detector gate (no skip)
        env:
          CGO_ENABLED: '1'
        run: |
          set -o pipefail
          go test -race ./component/resource ./adapter/provider ./rules/provider ./tunnel ./common/utils ./component/profile/cachefile -count=1 -v | tee memory/review-fix/macos-race.log
          go test -race -tags with_low_memory ./component/resource ./adapter/provider ./rules/provider ./tunnel -count=1 -v | tee memory/review-fix/macos-lowmem-race.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fetcher-review-evidence
          path: mihomo/memory/review-fix/*.log
